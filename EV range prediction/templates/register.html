{% extends 'base.html' %}

{% block title %}Register - Create EV Driver Account{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="neo-card neo-card-lg">
                <div class="text-center mb-4">
                    <div class="neo-brand-icon mx-auto mb-3" style="width: 58px; height: 58px;">
                        <i class="bi bi-person-plus-fill fs-4 text-neo-accent"></i>
                    </div>
                    <h3 class="fw-bold text-neo-primary mb-1">Create Account</h3>
                    <p class="text-neo-secondary small">Join the EV Range Intelligence platform</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="neo-input-group mb-3">
                        <label for="username" class="neo-label">Driver Username</label>
                        <input type="text" class="neo-input" id="username" name="username" placeholder="e.g. Phoenix" required autofocus>
                    </div>

                    <div class="neo-input-group mb-3">
                        <label for="email" class="neo-label">Email Address</label>
                        <input type="email" class="neo-input" id="email" name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="neo-input-group mb-3">
                        <label for="password" class="neo-label">Password (Min 6 Characters)</label>
                        <input type="password" class="neo-input" id="password" name="password" placeholder="Create a secure password" required minlength="6">
                    </div>

                    <div class="neo-input-group mb-4">
                        <label for="confirm_password" class="neo-label">Confirm Password</label>
                        <input type="password" class="neo-input" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
                    </div>

                    <button type="submit" class="btn-neo btn-neo-gradient w-100 py-3 mb-3">
                        <i class="bi bi-check2-circle"></i> Create Driver Account
                    </button>
                </form>

                <div class="text-center pt-3 border-top border-secondary-subtle">
                    <span class="small text-neo-muted">Already have an account?</span>
                    <a href="{{ url_for('login') }}" class="small fw-bold text-neo-accent ms-1">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
